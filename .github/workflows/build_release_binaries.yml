# GitHub Action workflow to build Windows binaries for every Impacket example
# tool and attach them to a release when one is created.
#

name: Build Windows release binaries

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build Windows binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Impacket
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build binaries
        shell: pwsh
        run: |
          .\.github\scripts\build-windows-binaries.ps1 -SourceDir "${{ github.workspace }}" -OutputDir "${{ github.workspace }}\dist-bin"

      # Always available, even for a manual (workflow_dispatch) test run that has no release to attach to
      - name: Upload binaries as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impacket-windows-binaries
          path: ${{ github.workspace }}\dist-bin\*.exe

      - name: Upload binaries to release
        if: always() && github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exeFiles = Get-ChildItem -Path "${{ github.workspace }}\dist-bin" -Filter '*.exe' | Select-Object -ExpandProperty FullName
          gh release upload "${{ github.event.release.tag_name }}" $exeFiles --clobber
